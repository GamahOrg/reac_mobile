name: reac
description: "REAC."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  mime_type:
  open_file:
  fluttertoast: ^8.2.5
  flutter_bloc: ^8.1.5
  flutter_native_splash: ^2.4.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  bloc: ^8.1.4
  dio: ^5.4.3+1
  json_serializable: ^6.8.0
  retrofit: ^4.1.0
  dartz: ^0.10.1
  freezed: ^2.5.2
  internet_connection_checker: ^1.0.0+1
  get_it: ^7.7.0
  injectable: ^2.4.1
  lottie: ^3.1.1
  equatable: ^2.0.5
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1
  infinite_scroll_pagination: ^4.0.0
  path_provider: ^2.1.3
  auto_size_text: ^3.0.0
  device_info_plus: ^10.1.0
  dotted_border: ^2.1.0


  flash: ^3.1.0
  simple_gradient_text: ^1.3.0
  pinput: ^5.0.0
  excel: ^2.0.4
  image_picker: ^1.1.2
  emoji_picker_flutter:
  file_picker:
  syncfusion_flutter_pdf: ^21.1.35
  pdf:



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  retrofit_generator: ^8.1.0
  injectable_generator: ^2.6.1

  build_runner: ^2.4.9

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  generate: true

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/json/
  fonts:
    - family: REGA
      fonts:
        - asset: assets/fonts/REGA-Black.ttf
        - asset: assets/fonts/REGA-Bold.ttf
        - asset: assets/fonts/REGA-ExtraBold.ttf
        - asset: assets/fonts/REGA-Regular.ttf
        - asset: assets/fonts/REGA-SemiBold.ttf
    - family: 29LT Bukra
      fonts:
        - asset: assets/fonts/fonnts.com-29LTBukra-Regular-Regular.ttf
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro-VariableFont_HEXP,wght.ttf
flutter_intl:
  enabled: true
